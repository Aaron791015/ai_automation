<!-- 全域 SVG 定義：漸層與濾鏡（hero／ring／sparkline 共用） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#29a8e0"/><stop offset="100%" stop-color="#7fd5f0"/>
  </linearGradient>
  <!-- hero 圓柱基座的柱面（上暗下更暗，做出圓柱感） -->
  <linearGradient id="drumGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#050d16"/><stop offset="26%" stop-color="#152534"/>
    <stop offset="58%" stop-color="#0c1926"/><stop offset="100%" stop-color="#040a12"/>
  </linearGradient>
  <!-- hero 中央地球的球面 -->
  <radialGradient id="globeGrad" cx="38%" cy="32%" r="72%">
    <stop offset="0%" stop-color="#1d5f86" stop-opacity=".85"/>
    <stop offset="62%" stop-color="#0b2f4b" stop-opacity=".8"/>
    <stop offset="100%" stop-color="#04121f" stop-opacity=".9"/>
  </radialGradient>
  <!-- 趨勢圖的面積漸層（參考圖的走勢線下方是柔和的漸層填色） -->
  <linearGradient id="sparkArea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7fd5f0" stop-opacity=".28"/>
    <stop offset="100%" stop-color="#7fd5f0" stop-opacity="0"/>
  </linearGradient>
  <filter id="hudGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="hudGlowSoft" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs></svg>
